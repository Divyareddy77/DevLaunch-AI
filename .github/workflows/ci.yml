# ============================================================
# CI — Continuous Integration (validation only)
# ============================================================
# What this workflow does:
#   - Runs when code is pushed to `develop` or `main`
#   - Runs on pull requests targeting `develop` or `main`
#   - Validates the backend (Maven tests), the frontend (production
#     build), and both Dockerfiles (image builds)
#
# What this workflow does NOT do:
#   - It never pushes images to Azure Container Registry
#   - It never touches Azure Container Apps
#   - It never deploys anything
#
# CI is validation only. Deployment is handled by `cd.yml`, which
# triggers when code lands on `main`.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The backend requires Java 21 — backend/pom.xml declares
      # <java.version>21</java.version> and backend/Dockerfile builds
      # on eclipse-temurin:21.
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # backend/mvnw is committed without the executable bit (the repo
      # is developed on Windows), so make it executable on the Ubuntu
      # runner before invoking it.
      - name: Run backend tests with Maven wrapper
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The frontend requires Node 20 — frontend/Dockerfile builds on
      # node:20-alpine and the lockfile is generated by npm.
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image builds (validation only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build context is the directory containing each Dockerfile.
      # Images are tagged locally only (`:ci`) — they are never pushed.
      - name: Build backend Docker image
        working-directory: backend
        run: docker build -t devlaunch-backend:ci .

      - name: Build frontend Docker image
        working-directory: frontend
        run: docker build -t devlaunch-frontend:ci .
