# Test profile configuration for @SpringBootTest integration tests
# (activated with @ActiveProfiles("test")). Loaded on top of the base
# application.yml, it swaps the MySQL datasource for an in-memory H2
# database (MySQL compatibility mode) and skips the MySQL-flavored seed
# data, which is not needed by the tests.
spring:
  datasource:
    url: jdbc:h2:mem:devlaunch;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
